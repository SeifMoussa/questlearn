<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { fill: #1e1c38; font-size: 22px; font-weight: 700; text-anchor: middle; }
    .subtitle { fill: #5c5878; font-size: 12px; text-anchor: middle; }
    .panelhdr { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .boxlabel { fill: #1e1c38; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .boxsub { fill: #5c5878; font-size: 10.5px; text-anchor: middle; }
    .cyllabel { fill: #1e1c38; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
    .cylsub { fill: #5c5878; font-size: 10px; text-anchor: middle; }
    .arrowlabel { fill: #454263; font-size: 10.5px; text-anchor: middle; }
    .note { fill: #5c5878; font-size: 11.5px; }
    .notetitle { fill: #1e40af; font-size: 12.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a12" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#454263"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="26" class="title">Local Infrastructure &amp; Environment</text>
  <text x="700" y="46" class="subtitle">Two distinct things — docker-compose.yml runs local dev infra only; the two Dockerfiles (Module 10) are a separate, later addition for production images</text>

  <!-- Left panel: Local development -->
  <rect x="30" y="65" width="650" height="555" rx="10" fill="#eef6ec" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="65" width="650" height="26" rx="10" fill="#16a34a"/>
  <rect x="30" y="78" width="650" height="13" fill="#16a34a"/>
  <text x="355" y="83" class="panelhdr">Local development (docker-compose.yml)</text>

  <rect x="90" y="112" width="530" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="355" y="134" class="boxlabel">pnpm dev:api / dev:web</text>
  <text x="355" y="150" class="boxsub">nest start --watch / next dev</text>
  <text x="355" y="164" class="boxsub">runs on the HOST, not in a container</text>

  <line x1="250" y1="176" x2="250" y2="298" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="250" y="220" class="arrowlabel">DATABASE_URL</text>

  <line x1="560" y1="176" x2="560" y2="298" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="560" y="216" class="arrowlabel">REDIS_URL</text>
  <text x="560" y="229" class="arrowlabel" font-style="italic">(health-check only —</text>
  <text x="560" y="242" class="arrowlabel" font-style="italic">see 01-system-architecture)</text>

  <!-- Postgres cylinder -->
  <g>
    <path d="M140,315 a110,16 0 0 0 220,0 v100 a110,16 0 0 1 -220,0 z" fill="#1e40af"/>
    <ellipse cx="250" cy="315" rx="110" ry="16" fill="#3357c9"/>
    <text x="250" y="366" class="cyllabel" fill="#ffffff">Postgres 17-alpine</text>
    <text x="250" y="382" class="cylsub" fill="#dfe6fb">questlearn-postgres</text>
    <text x="250" y="396" class="cylsub" fill="#dfe6fb">health-checked, volume-persisted</text>
  </g>

  <!-- Redis cylinder (dashed, health-check only) -->
  <g>
    <path d="M450,315 a110,16 0 0 0 220,0 v100 a110,16 0 0 1 -220,0 z" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
    <ellipse cx="560" cy="315" rx="110" ry="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="560" y="366" class="cyllabel">Redis 8-alpine</text>
    <text x="560" y="382" class="cylsub">questlearn-redis</text>
    <text x="560" y="396" class="cylsub">health-checked, volume-persisted</text>
  </g>

  <!-- Right panel: Production images -->
  <rect x="720" y="65" width="650" height="555" rx="10" fill="#f1effe" stroke="#3f30c4" stroke-width="2"/>
  <rect x="720" y="65" width="650" height="26" rx="10" fill="#3f30c4"/>
  <rect x="720" y="78" width="650" height="13" fill="#3f30c4"/>
  <text x="1045" y="83" class="panelhdr">Production images (Module 10)</text>

  <rect x="760" y="112" width="290" height="100" rx="8" fill="#ffffff" stroke="#3f30c4" stroke-width="1.4"/>
  <text x="905" y="132" class="boxlabel">apps/api/Dockerfile</text>
  <text x="905" y="150" class="boxsub">multi-stage: build stage (full deps,</text>
  <text x="905" y="163" class="boxsub">prisma generate, nest build)</text>
  <text x="905" y="176" class="boxsub">→ runner stage (copies built</text>
  <text x="905" y="189" class="boxsub">node_modules + dist)</text>

  <rect x="1070" y="112" width="290" height="100" rx="8" fill="#ffffff" stroke="#3f30c4" stroke-width="1.4"/>
  <text x="1215" y="132" class="boxlabel">apps/web/Dockerfile</text>
  <text x="1215" y="150" class="boxsub">multi-stage: build stage</text>
  <text x="1215" y="163" class="boxsub">(next build, output: standalone)</text>
  <text x="1215" y="176" class="boxsub">→ runner stage (trimmed</text>
  <text x="1215" y="189" class="boxsub">self-contained server.js)</text>

  <line x1="905" y1="212" x2="905" y2="248" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>
  <line x1="1215" y1="212" x2="1215" y2="248" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>

  <rect x="760" y="250" width="290" height="56" rx="8" fill="#3f30c4"/>
  <text x="905" y="273" class="boxlabel" fill="#ffffff">questlearn-api image</text>
  <text x="905" y="289" class="boxsub" fill="#dfe0f7">node dist/main.js</text>

  <rect x="1070" y="250" width="290" height="56" rx="8" fill="#3f30c4"/>
  <text x="1215" y="273" class="boxlabel" fill="#ffffff">questlearn-web image</text>
  <text x="1215" y="289" class="boxsub" fill="#dfe0f7">node apps/web/server.js</text>

  <line x1="1067" y1="278" x2="1053" y2="278" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="1060" y="222" class="arrowlabel">NEXT_PUBLIC_API_URL</text>
  <text x="1060" y="235" class="arrowlabel" font-style="italic">(build-time, inlined —</text>
  <text x="1060" y="248" class="arrowlabel" font-style="italic">not a runtime env var)</text>

  <!-- Cross-panel: ApiImage -> Postgres (solid) -->
  <path d="M790,306 L790,580 L250,580 L250,432" fill="none" stroke="#454263" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="520" y="573" class="arrowlabel">DATABASE_URL, REDIS_URL, JWT_SECRET,</text>
  <text x="520" y="587" class="arrowlabel">CSRF_SECRET, WEB_URL (all required)</text>

  <!-- Cross-panel: ApiImage -.-> Redis (dashed) -->
  <path d="M980,306 L980,605 L560,605 L560,432" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#a12)"/>
  <text x="770" y="617" class="arrowlabel" fill="#dc2626" font-style="italic">health-check only, not sessions/rate-limits</text>

  <!-- Why note -->
  <rect x="30" y="635" width="1340" height="110" rx="8" fill="#fdf3e4" stroke="#d97f06" stroke-width="1.4"/>
  <text x="48" y="658" class="notetitle" fill="#d97f06">Why the API image is larger than the web image (~297MB vs. ~86MB compressed)</text>
  <text x="48" y="679" class="note">The API runner stage copies the build stage's full node_modules (devDependencies included) rather than a scoped</text>
  <text x="48" y="696" class="note">production-only install — the workspace root's postinstall script runs on every pnpm install regardless of --prod and</text>
  <text x="48" y="713" class="note">has no tsc to build with once devDependencies are stripped. A documented tradeoff for build reliability (see</text>
  <text x="48" y="730" class="note">SECURITY_NOTES.md), not an oversight. The web image avoids this via Next's output: "standalone".</text>

  <!-- Source footer -->
  <rect x="30" y="755" width="1340" height="48" rx="8" fill="#ffffff" stroke="#454263" stroke-width="1.4"/>
  <text x="48" y="775" class="note">Source: docker-compose.yml, apps/api/Dockerfile, apps/web/Dockerfile, apps/web/next.config.js (output: "standalone",</text>
  <text x="48" y="792" class="note">gated behind a DOCKER_BUILD flag — see that file's own comments for why).</text>
</svg>
