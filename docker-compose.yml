services:
  postgres:
    image: postgres:17-alpine
    container_name: questlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: questlearn
      POSTGRES_PASSWORD: questlearn
      POSTGRES_DB: questlearn
    ports:
      - "5432:5432"
    volumes:
      - questlearn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlearn -d questlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: questlearn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - questlearn-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questlearn-postgres-data:
  questlearn-redis-data:
